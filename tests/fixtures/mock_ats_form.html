<!DOCTYPE html>
<html>
<head><title>Mock ATS Application</title></head>
<body>
  <h1>Apply to Example Corp</h1>
  <form id="application_form">
    <input type="text" id="first_name" name="first_name" placeholder="First name">
    <input type="text" id="last_name" name="last_name" placeholder="Last name">
    <input type="email" id="email" name="email" placeholder="Email">
    <input type="tel" id="phone" name="phone" placeholder="Phone">
    <input type="text" id="linkedin_url" name="linkedin_url" placeholder="LinkedIn URL">
    <input type="file" id="resume_upload" name="resume_upload">
    <button type="submit" id="submit_btn">Submit Application</button>
  </form>
</body>
</html>
