# Copy this to config.yaml and fill in your details.
# Secrets (DEEPSEEK_API_KEY, ADZUNA_*) come from environment variables /
# GitHub Actions secrets, NOT from this file.

candidate:
  first_name: "Jane"
  last_name: "Doe"
  email: "jane.doe@example.com"
  phone: "555-555-5555"
  linkedin_url: "linkedin.com/in/janedoe"

resume:
  master_data: "data/master_resume.yaml"
  template: "templates/resume.tex.j2"
  output_dir: "output/resumes"
  # Optional menu of pre-written project bullets grouped by angle. DeepSeek may
  # pick and rephrase from it per role; its numbers count as a grounded source
  # so real metrics in it are not flagged as fabrication. Set "" to disable.
  bullet_bank: ""
  # Summary section on tailored resumes: true always, false never, or leave it
  # out to follow master_resume.yaml. Off: career offices advise new grads to
  # spend the space on bullets. The summary still feeds the cover letter.
  include_summary: false
  # Hard one-page guarantee: if a resume compiles to >1 page, auto-trim (drop
  # summary, then fewer bullets/projects) and re-render until it fits.
  force_one_page: true

