  lever:                 # api.lever.co/<slug> -- verified live on the Lever API
    - "spotify"
    - "palantir"
  # Additional ATS platforms. Same idea as greenhouse: list each company's
  # board slug (the token in its careers URL). Ashby/Workable return job
  # descriptions inline; SmartRecruiters costs one extra request per posting.
  ashby:               # jobs.ashbyhq.com/<slug> -- verified live on the Ashby API
    - "ramp"
    - "notion"
    - "openai"
    - "perplexity"
    - "cohere"
    - "linear"
    - "vanta"
    - "runway"
    # Batch 3 -- verified live on the Ashby API.
    - "elevenlabs"
    - "suno"
