name: Daily Job Scan & Resume Tailoring

on:
  schedule:
    
    - cron: "37 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-and-tailor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra latexmk

      - name: Scan, match, tailor, render
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PIPELINE_CONTACT: ${{ secrets.PIPELINE_CONTACT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main --config config.yaml
        
      - name: Upload application packages
        uses: actions/upload-artifact@v4
        with:
          name: apply-queue-${{ github.run_number }}
          path: |
            output/resumes/
            output/cover_letters/
            output/referrals/
            output/apply_index.md
            output/apply_index.txt
            output/ats_report.md
            output/judge_review.md
            output/grounding_review.md
            data/apply_queue.json
          retention-days: 14

      - name: Commit seen-jobs log
        run: |
          git config user.name "job-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json data/apply_queue.json
          git diff --cached --quiet || git commit -m "Update job scan results [skip ci]"
          git push
